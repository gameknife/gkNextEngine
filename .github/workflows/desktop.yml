name: Desktop CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache-dependency-path: tools/gnb/go.sum
      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip tar ninja-build libxi-dev libxinerama-dev libxcursor-dev libxrandr-dev wayland-protocols libxkbcommon-dev xorg-dev mono-complete
      - uses: microsoft/setup-msbuild@v3
        if: runner.os == 'Windows'
      # Agent scripts are forwarded to the engine verbatim, so a misspelled field
      # silently becomes a default. This check launches nothing and needs no GPU.
      - name: Check agent scripts
        if: runner.os == 'Linux'
        run: ./gnb.sh validate --lint
      - name: Configure vcpkg binary cache
        uses: ./.github/actions/vcpkg-cache
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup dependencies
        shell: pwsh
        run: |
          if ("${{ runner.os }}" -eq "Windows") {
            .\gnb.bat setup
          } else {
            ./gnb.sh setup
          }
      - name: Build
        shell: pwsh
        run: |
          if ("${{ runner.os }}" -eq "Windows") {
            .\gnb.bat build --jobs $env:NUMBER_OF_PROCESSORS
          } else {
            ./gnb.sh build
          }
      # CI runners have no Vulkan device, so tests that build a real swapchain
      # (tagged [GPU]) are excluded. Run the full suite locally before a release.
      - name: Test
        shell: pwsh
        run: |
          if ("${{ runner.os }}" -eq "Windows") {
            .\gnb.bat test "~[GPU]"
          } else {
            ./gnb.sh test "~[GPU]"
          }
      # Desktop and Web clients share one DS, so NextDayzCore must encode the
      # same protocol bytes, and its client session must treat a DS message
      # stream the same way, on every compiler and architecture. The NextDayz
      # Web workflow checks the wasm32 side against the same golden files.
      - name: NextDayz protocol and client replay goldens
        shell: pwsh
        run: |
          $gnb = if ($IsWindows) { '.\gnb.bat' } else { './gnb.sh' }
          $preset = if ($IsWindows) { 'windows' } elseif ($IsMacOS) { 'macos-arm64' } else { 'linux' }
          & $gnb build NextDayzProtocolGolden NextDayzCoreRules NextDayzClientReplay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = "out/build/$preset/bin"
          $source = 'src/Application/Web/NextDayzWebCore'
          foreach ($check in @(@('NextDayzProtocolGolden', 'protocol-golden.txt'), @('NextDayzClientReplay', 'client-replay-golden.txt'))) {
            $actual = @(& "$bin/$($check[0])")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $expected = @(Get-Content "$source/$($check[1])")
            $diff = Compare-Object $expected $actual -SyncWindow 0 -CaseSensitive
            if ($diff) {
              $diff | Format-Table -AutoSize | Out-String -Width 400 | Write-Host
              throw "$($check[0]) output differs from $($check[1])"
            }
          }
          & "$bin/NextDayzCoreRules"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

name: Desktop CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip tar ninja-build libxi-dev libxinerama-dev libxcursor-dev libxrandr-dev wayland-protocols libxkbcommon-dev xorg-dev mono-complete
      - name: Cache key
        id: gnb
        shell: pwsh
        run: |
          if ("${{ runner.os }}" -eq "Windows") {
            "key=$(.\gnb.bat info --bincache-key)" >> $env:GITHUB_OUTPUT
          } else {
            "key=$(./gnb.sh info --bincache-key)" >> $env:GITHUB_OUTPUT
          }
      - name: Restore local vcpkg binary cache
        uses: actions/cache/restore@v6
        id: cache-vcpkg-restore
        with:
          path: .vcpkg_bincache
          key: ${{ steps.gnb.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-
      - uses: microsoft/setup-msbuild@v3
        if: runner.os == 'Windows'
      - name: Setup dependencies
        shell: pwsh
        run: |
          if ("${{ runner.os }}" -eq "Windows") {
            .\gnb.bat setup
          } else {
            ./gnb.sh setup
          }
      - name: Setup NuGet Binary Cache for GitHub Packages
        shell: pwsh
        env:
          FEED_URL: "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          NUGET_USER: "${{ github.actor }}"
          NUGET_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          IS_FORK: "${{ github.event.pull_request.head.repo.fork }}"
        run: |
          $repoRoot = (Get-Location).Path
          $bincachePath = Join-Path $repoRoot ".vcpkg_bincache"
          $access = if ($env:IS_FORK -eq "true") { "read" } else { "readwrite" }

          if ("${{ runner.os }}" -eq "Windows") {
            $vcpkgExe = Join-Path $repoRoot ".vcpkg\vcpkg.exe"
            $nuget = & $vcpkgExe fetch nuget | Select-Object -Last 1
            if ($nuget -and (Test-Path $nuget)) {
              & $nuget sources remove -Name "github-packages" -ErrorAction SilentlyContinue | Out-Null
              & $nuget sources add -Name "github-packages" -Source $env:FEED_URL -UserName $env:NUGET_USER -Password $env:NUGET_TOKEN -StorePasswordInClearText | Out-Null
              "VCPKG_BINARY_SOURCES=clear;nuget,$($env:FEED_URL),$access;files,$bincachePath,readwrite" >> $env:GITHUB_ENV
              "VCPKG_NUGET_REPOSITORY=${{ github.server_url }}/${{ github.repository }}" >> $env:GITHUB_ENV
              Write-Host "Configured Windows NuGet binary cache pointing to GitHub Packages ($access)"
            } else {
              "VCPKG_BINARY_SOURCES=clear;files,$bincachePath,readwrite" >> $env:GITHUB_ENV
              Write-Host "NuGet not available, falling back to local files binary cache"
            }
          } elseif ("${{ runner.os }}" -eq "Linux") {
            $vcpkgExe = Join-Path $repoRoot ".vcpkg/vcpkg"
            $nuget = & $vcpkgExe fetch nuget | Select-Object -Last 1
            if ($nuget -and (Get-Command mono -ErrorAction SilentlyContinue)) {
              mono $nuget sources remove -Name "github-packages" 2>$null | Out-Null
              mono $nuget sources add -Name "github-packages" -Source $env:FEED_URL -UserName $env:NUGET_USER -Password $env:NUGET_TOKEN -StorePasswordInClearText | Out-Null
              "VCPKG_BINARY_SOURCES=clear;nuget,$($env:FEED_URL),$access;files,$bincachePath,readwrite" >> $env:GITHUB_ENV
              "VCPKG_NUGET_REPOSITORY=${{ github.server_url }}/${{ github.repository }}" >> $env:GITHUB_ENV
              Write-Host "Configured Linux NuGet binary cache with Mono pointing to GitHub Packages ($access)"
            } else {
              "VCPKG_BINARY_SOURCES=clear;files,$bincachePath,readwrite" >> $env:GITHUB_ENV
              Write-Host "Mono/NuGet not available on Linux, falling back to local files binary cache"
            }
          } else {
            # macOS: NuGet requires Mono which is not well-supported on arm64 macOS runners. Use fast local files cache.
            "VCPKG_BINARY_SOURCES=clear;files,$bincachePath,readwrite" >> $env:GITHUB_ENV
            Write-Host "Configured macOS binary cache using files cache"
          }
      - name: Build
        shell: pwsh
        run: |
          if ("${{ runner.os }}" -eq "Windows") {
            .\gnb.bat build
          } else {
            ./gnb.sh build
          }
      # CI runners have no Vulkan device, so tests that build a real swapchain
      # (tagged [GPU]) are excluded. Run the full suite locally before a release.
      - name: Test
        shell: pwsh
        run: |
          if ("${{ runner.os }}" -eq "Windows") {
            .\gnb.bat test "~[GPU]"
          } else {
            ./gnb.sh test "~[GPU]"
          }
      - name: Save local vcpkg binary cache
        uses: actions/cache/save@v6
        if: steps.cache-vcpkg-restore.outputs.cache-hit != 'true'
        with:
          path: .vcpkg_bincache
          key: ${{ steps.gnb.outputs.key }}

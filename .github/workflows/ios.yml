name: iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - name: Configure vcpkg binary cache
        uses: ./.github/actions/vcpkg-cache
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: ./gnb.sh setup --skip-paks
      - run: ./gnb.sh ios build

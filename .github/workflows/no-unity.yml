name: No-Unity Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  windows-no-unity:
    name: Windows No-Unity
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - uses: microsoft/setup-msbuild@v3
      - name: Configure vcpkg binary cache
        uses: ./.github/actions/vcpkg-cache
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup dependencies
        run: .\gnb.bat setup
      - name: Build all targets without Unity Build
        run: .\gnb.bat --preset windows-no-unity build --all --reconfigure

name: Release gkNextEngine

on:
  push:
    tags:
      - 'v*'

# Never publish partial builds or drafts containing the pending Brotato asset refresh.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  make-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          body_path: docs/releases/next-release.md
          generate_release_notes: true

  linux-build:
    needs: make-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      packages: write
    env:
      # GitHub runners have no hardware Vulkan device.  Lavapipe plus Xvfb
      # drives the hidden trace runs and produces platform-neutral runtime paks.
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - name: Test packaging tools
        working-directory: tools/gnb
        run: go test ./internal/packager ./internal/config
      - name: Cache key
        id: gnb
        shell: pwsh
        run: |
          "key=$(./gnb.sh info --bincache-key)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v6
        id: cache-vcpkg-restore
        with:
          path: .vcpkg_bincache
          key: ${{ steps.gnb.outputs.key }}
          restore-keys: |
            Linux-vcpkg-
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip p7zip-full tar ninja-build libxi-dev libxinerama-dev libxcursor-dev libxrandr-dev wayland-protocols libxkbcommon-dev xorg-dev mesa-vulkan-drivers xvfb mono-complete
      - name: Setup NuGet Binary Cache for GitHub Packages
        shell: pwsh
        env:
          FEED_URL: "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          NUGET_USER: "${{ github.actor }}"
          NUGET_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          $repoRoot = (Get-Location).Path
          $bincachePath = Join-Path $repoRoot ".vcpkg_bincache"
          ./gnb.sh setup --vcpkg-only
          $vcpkgExe = Join-Path $repoRoot ".vcpkg/vcpkg"
          $nuget = & $vcpkgExe fetch nuget | Select-Object -Last 1
          if ($nuget -and (Get-Command mono -ErrorAction SilentlyContinue)) {
            mono $nuget sources remove -Name "github-packages" 2>$null | Out-Null
            mono $nuget sources add -Name "github-packages" -Source $env:FEED_URL -UserName $env:NUGET_USER -Password $env:NUGET_TOKEN -StorePasswordInClearText | Out-Null
            "VCPKG_BINARY_SOURCES=clear;nuget,$($env:FEED_URL),readwrite;files,$bincachePath,readwrite" >> $env:GITHUB_ENV
            "VCPKG_NUGET_REPOSITORY=${{ github.server_url }}/${{ github.repository }}" >> $env:GITHUB_ENV
            Write-Host "Configured Linux NuGet binary cache with Mono pointing to GitHub Packages (readwrite)"
          } else {
            "VCPKG_BINARY_SOURCES=clear;files,$bincachePath,readwrite" >> $env:GITHUB_ENV
          }
      - name: Upgrade Lavapipe for headless validation
        run: |
          sudo apt-get install --no-install-recommends --yes software-properties-common
          sudo add-apt-repository --yes ppa:kisak/kisak-mesa
          sudo apt-get update
          sudo apt-get install --only-upgrade --yes mesa-vulkan-drivers libgbm1 libgl1-mesa-dri
          sudo apt-get install --no-install-recommends --yes vulkan-tools
          lavapipe_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$lavapipe_icd"
          echo "Using Lavapipe ICD: $lavapipe_icd"
          echo "VK_ICD_FILENAMES=$lavapipe_icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$lavapipe_icd" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$lavapipe_icd" VK_DRIVER_FILES="$lavapipe_icd" \
            vulkaninfo | grep --fixed-strings --quiet VK_EXT_headless_surface
      - name: Build release targets
        run: |
          echo "BUILDVER($RELEASE_TAG)" > src/build.version
          ./gnb.sh setup
          ./gnb.sh build --tracy=off gkNextRenderer gkNextEditor ScadLibrary NextAstrobot Brotato3D Packager
      - name: Trace runtime assets with Lavapipe and package Linux
        run: |
          xvfb-run --auto-servernum ./gnb.sh package linux --package-preset default --trace-assets --version "$RELEASE_TAG"
          mkdir -p release-paks/default
          cp out/build/linux/assets/paks/runtime.pak release-paks/default/runtime.pak
          cp assets/paks/brotato3d.pak release-paks/default/brotato3d.pak
          cp out/build/linux/asset-traces/default-assets.txt release-paks/default/runtime-assets.txt
          cp out/build/linux/assets/paks/runtime.manifest.json release-paks/default/runtime.manifest.json
      - name: Smoke test package
        run: ./gnb.sh smoke "./gknextrenderer_linux64_${RELEASE_TAG}.7z" --keep --staging release-smoke
      - name: Verify targets and loose authoring files
        run: python tools/release/verify-package.py release-smoke
      - name: Share precise runtime paks
        uses: actions/upload-artifact@v4
        with:
          name: release-runtime-paks
          path: release-paks
          if-no-files-found: error
          retention-days: 7
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: ./gknextrenderer_linux64_${{ github.ref_name }}.7z

      - uses: actions/cache/save@v6
        if: steps.cache-vcpkg-restore.outputs.cache-hit != 'true'
        with:
          path: .vcpkg_bincache
          key: ${{ steps.gnb.outputs.key }}

  windows-build:
    needs: linux-build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - name: Test packaging tools
        working-directory: tools/gnb
        run: go test ./internal/packager ./internal/config
      - name: Cache key
        id: gnb
        shell: pwsh
        run: |
          "key=$(./gnb.bat info --bincache-key)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v6
        id: cache-vcpkg-restore
        with:
          path: .vcpkg_bincache
          key: ${{ steps.gnb.outputs.key }}
          restore-keys: |
            Windows-vcpkg-
      - uses: microsoft/setup-msbuild@v3
      - name: Setup NuGet Binary Cache for GitHub Packages
        shell: pwsh
        env:
          FEED_URL: "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          NUGET_USER: "${{ github.actor }}"
          NUGET_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          $repoRoot = (Get-Location).Path
          $bincachePath = Join-Path $repoRoot ".vcpkg_bincache"
          .\gnb.bat setup --vcpkg-only
          $vcpkgExe = Join-Path $repoRoot ".vcpkg\vcpkg.exe"
          $nuget = & $vcpkgExe fetch nuget | Select-Object -Last 1
          if ($nuget -and (Test-Path $nuget)) {
            & $nuget sources remove -Name "github-packages" -ErrorAction SilentlyContinue | Out-Null
            & $nuget sources add -Name "github-packages" -Source $env:FEED_URL -UserName $env:NUGET_USER -Password $env:NUGET_TOKEN -StorePasswordInClearText | Out-Null
            "VCPKG_BINARY_SOURCES=clear;nuget,$($env:FEED_URL),readwrite;files,$bincachePath,readwrite" >> $env:GITHUB_ENV
            "VCPKG_NUGET_REPOSITORY=${{ github.server_url }}/${{ github.repository }}" >> $env:GITHUB_ENV
            Write-Host "Configured Windows NuGet binary cache pointing to GitHub Packages (readwrite)"
          } else {
            "VCPKG_BINARY_SOURCES=clear;files,$bincachePath,readwrite" >> $env:GITHUB_ENV
          }
      - name: Build release targets
        shell: pwsh
        run: |
          "BUILDVER($env:RELEASE_TAG)" | Set-Content src/build.version -NoNewline
          .\gnb.bat setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\gnb.bat build --tracy=off gkNextRenderer gkNextEditor ScadLibrary NextAstrobot Brotato3D
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download precise runtime paks
        uses: actions/download-artifact@v4
        with:
          name: release-runtime-paks
          path: release-paks
      - name: Package
        shell: pwsh
        run: |
          Copy-Item release-paks/default/brotato3d.pak assets/paks/brotato3d.pak
          Copy-Item release-paks/default/brotato3d.pak out/build/windows/assets/paks/brotato3d.pak
          .\gnb.bat package windows --package-preset default --runtime-pak release-paks/default --version "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test package
        run: |
          .\gnb.bat smoke "gknextrenderer_win64_$env:RELEASE_TAG.7z" --keep --staging release-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
      - name: Verify targets and loose authoring files
        run: python tools/release/verify-package.py release-smoke
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: ./gknextrenderer_win64_${{ github.ref_name }}.7z

      - uses: actions/cache/save@v6
        if: steps.cache-vcpkg-restore.outputs.cache-hit != 'true'
        with:
          path: .vcpkg_bincache
          key: ${{ steps.gnb.outputs.key }}

  macos-build:
    needs: linux-build
    runs-on: macos-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - name: Test packaging tools
        working-directory: tools/gnb
        run: go test ./internal/packager ./internal/config
      - name: Cache key
        id: gnb
        shell: pwsh
        run: |
          "key=$(./gnb.sh info --bincache-key)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v6
        id: cache-vcpkg-restore
        with:
          path: .vcpkg_bincache
          key: ${{ steps.gnb.outputs.key }}
          restore-keys: |
            macOS-vcpkg-
      - name: Install 7-Zip
        run: brew install sevenzip
      - name: Build release targets
        run: |
          echo "BUILDVER($RELEASE_TAG)" > src/build.version
          ./gnb.sh setup
          ./gnb.sh build --tracy=off gkNextRenderer gkNextEditor ScadLibrary NextAstrobot Brotato3D
      - name: Download precise runtime paks
        uses: actions/download-artifact@v4
        with:
          name: release-runtime-paks
          path: release-paks
      - name: Package
        run: |
          cp release-paks/default/brotato3d.pak assets/paks/brotato3d.pak
          cp release-paks/default/brotato3d.pak out/build/macos-arm64/assets/paks/brotato3d.pak
          ./gnb.sh package macos --package-preset default --runtime-pak release-paks/default --version "$RELEASE_TAG"
      - name: Smoke test package
        run: ./gnb.sh smoke "./gknextrenderer_macos_${RELEASE_TAG}.7z" --keep --staging release-smoke
      - name: Verify targets and loose authoring files
        run: python tools/release/verify-package.py release-smoke
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: ./gknextrenderer_macos_${{ github.ref_name }}.7z
      - uses: actions/cache/save@v6
        if: steps.cache-vcpkg-restore.outputs.cache-hit != 'true'
        with:
          path: .vcpkg_bincache
          key: ${{ steps.gnb.outputs.key }}

  draft-ready:
    needs: [linux-build, windows-build, macos-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Record release handoff
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'NOTES'
          All three desktop archives passed package smoke tests and loose-source verification.
          The release remains a **draft**. Replace the proprietary Brotato reference assets,
          rebuild all archives from the replacement commit, then complete clean-machine
          acceptance in docs/guides/release-process.md before publishing manually.
          NOTES

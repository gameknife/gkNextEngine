<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NextDayz Web · W0 验收</title>
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">{"imports":{"three":"/three","three/addons/":"/addons/"}}</script>
</head>
<body>
  <main>
    <header>
      <p class="brand">NEXTDAYZ <span>WEB</span></p>
      <h1>W0 技术验证</h1>
    </header>
    <section aria-labelledby="map-title">
      <div class="toolbar">
        <div>
          <h2 id="map-title">场景与碰撞</h2>
          <p>SCAD 离线烘焙 · three.js · Jolt WASM</p>
        </div>
        <form id="maps">
          <label for="map">地图</label>
          <select id="map">
            <option value="training_ground">训练场 v3</option>
            <option value="cz_loket_riverbend">洛克特·河湾 v8</option>
          </select>
          <button>加载</button>
        </form>
      </div>
      <div id="viewport">
        <canvas aria-label="NextDayz 地图预览" tabindex="0"></canvas>
        <output id="scene-status" role="status">正在下载场景及碰撞数据…</output>
        <div id="scene-controls" hidden>
          <button id="overview" type="button">俯瞰</button>
          <button id="reset" type="button">回到起点</button>
        </div>
      </div>
      <div class="toolbar footer">
        <p>点击画面后用 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动，<kbd>Q</kbd><kbd>E</kbd> 转向。</p>
        <output id="frame-stats"></output>
      </div>
      <dl id="bake-stats" class="metrics"></dl>
    </section>
    <div class="checks">
      <section aria-labelledby="protocol-title">
        <h2 id="protocol-title">同源协议</h2>
        <p id="protocol-status" role="status">正在读取对照结果…</p>
        <details>
          <summary>布局与消息字节</summary>
          <pre id="protocol-bytes"></pre>
        </details>
      </section>
      <section aria-labelledby="rtc-title">
        <h2 id="rtc-title">WebRTC 双通道</h2>
        <p>同时连接两个对端，验证可靠、有序与零重传通道，以及服务端 UDP 端口复用。</p>
        <div class="actions">
          <button id="rtc-direct" type="button">测试连接</button>
          <button id="rtc-loss" type="button">测试 2% UDP 丢包</button>
        </div>
        <output id="rtc-status" role="status"></output>
      </section>
    </div>
  </main>
  <script type="module" src="/preview.mjs"></script>
</body>
</html>

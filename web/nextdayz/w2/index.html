<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NextDayz · 地图烘焙验收</title>
    <link rel="stylesheet" href="/style.css">
    <script type="importmap">{"imports":{"three":"/three/build/three.module.js"}}</script>
    <script type="module" src="/review.mjs"></script>
</head>
<body>
    <header>
        <h1>NextDayz <span>地图烘焙验收</span></h1>
        <nav id="maps" aria-label="已发布地图"></nav>
    </header>
    <main>
        <section id="viewport" aria-label="地图视窗">
            <p role="status" id="status">正在读取资源清单</p>
            <div id="views" aria-label="镜头">
                <button id="overview" type="button" disabled>全图</button>
                <button id="detail" type="button" disabled>核心区</button>
                <button id="spawn" type="button" disabled>出生点</button>
            </div>
            <p class="help">拖动旋转 · 滚动缩放 · 右键拖动平移</p>
        </section>
        <aside aria-label="烘焙统计">
            <h2 id="map-title">已发布地图</h2>
            <p id="map-version"></p>
            <dl id="metrics"></dl>
            <h3>地图锚点</h3>
            <div id="anchors"></div>
        </aside>
    </main>
</body>
</html>
